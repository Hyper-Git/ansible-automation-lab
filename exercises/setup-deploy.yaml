---
- name: Prepare app server for deployments
  hosts: localhost
  become: true

  tasks:
    - name: deploy user is present
      ansible.builtin.user:
        name: deploy
        state: present

    - name: /opt/app directory exists owned by deploy
      ansible.builtin.file:
        path: /opt/app
        owner: deploy
        state: directory
        group: deploy



