---
# tasks file for webserver
- name: Ensure nginx is installed
  ansible.builtin.apt:
    name: "{{ web_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
- name: Ensure nginx is running and enabled at boot
  ansible.builtin.service:
    name: "{{ web_package }}"
    state: started
    enabled: true
- name: Ensure opsbot user exists with a home directory
  ansible.builtin.user:
    name: "{{ ops_user }}"
    shell: /bin/bash
    create_home: true
    state: present
- name: Ensure /opt/ops-lab directory exists
  ansible.builtin.file:
    path: "{{ ops_dir }}"
    state: directory
    owner: "{{ ops_user }}"
    group: "{{ ops_user }}"
    mode: "0755"
- name: Ensure homepage shows deploy message
  ansible.builtin.copy:
    dest: /var/www/html/index.html
    content: "Deployed by Ansible on {{ inventory_hostname }}-v2\n"
    mode: "0644"
- name: Ensure nginx hides its version number
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '^\s*server_tokens'
    line: "\tserver_tokens off;"
    validate: "nginx -t -c %s"
  notify: Reload nginx
